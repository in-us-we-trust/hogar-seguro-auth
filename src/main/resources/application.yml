spring:
  application:
    name: hogar-seguro-auth
  cloud:
    config:
      enabled: false
  config:
    import: "optional:configserver:"

  #CONFIGURACIÓN BASE DE DATOS (por defecto H2, override con env para Neon/Postgres)
  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
    properties:
      hibernate:
        format_sql: true

  #consola web de H2
  h2:
    console:
      enabled: true
      path: /h2-console
  # -------------------------------------------------

server:
  port: ${AUTH_PORT:8081}

jwt:
  secret: ${JWT_SECRET:secreto_local_desarrollo_minimo_32_caracteres}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    ar.edu.uba.hogar: DEBUG
    org.springframework.security: DEBUG

# Email (Brevo)
email:
  provider: ${EMAIL_PROVIDER:dummy}

brevo:
  api:
    key: ${BREVO_API_KEY:}
    url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  sender:
    name: ${BREVO_SENDER_NAME:Hogar Seguro}
    email: ${BREVO_SENDER_EMAIL:}

app:
  reset-password-url: ${APP_RESET_PASSWORD_URL:https://hogar-seguro.app/reset-password}


