spring:
  application:
    name: auth-service
  cloud:
    config:
      enabled: false  # <--- AGREGA ESTA LÍNEA
  config:
    import: "optional:configserver:" # <--- AGREGA ESTA LÍNEA (evita el error que viste)

    # ... el resto de tu configuración (datasource, jpa, etc.) sigue igual
    # BORRAR LUEGO----------------


  # CONFIGURACIÓN BASE DE DATOS TEMPORAL (H2)
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

  #consola web de H2
  h2:
    console:
      enabled: true
      path: /h2-console
  # -------------------------------------------------

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:secreto_local_desarrollo_minimo_32_caracteres}

server:
  port: ${AUTH_PORT:8081}

jwt:
  secret: ${JWT_SECRET:secreto_local_desarrollo_minimo_32_caracteres}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    ar.edu.uba.hogar: DEBUG
    org.springframework.security: DEBUG


