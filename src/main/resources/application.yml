spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auth_db}
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:auth_pass123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:secreto_local_desarrollo_minimo_32_caracteres}

server:
  port: ${AUTH_PORT:8081}

jwt:
  secret: ${JWT_SECRET:secreto_local_desarrollo_minimo_32_caracteres}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    ar.edu.uba.hogar: DEBUG
    org.springframework.security: DEBUG