spring.application.name=hogar-seguro-auth
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

server.port=${AUTH_PORT:8086}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT
jwt.secret=${JWT_SECRET:secreto_local_desarrollo_minimo_32_caracteres}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Logging
logging.level.ar.edu.uba.hogar=DEBUG
logging.level.org.springframework.security=DEBUG

# Email (Brevo)
email.provider=${EMAIL_PROVIDER:dummy}

brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.sender.name=${BREVO_SENDER_NAME:Hogar Seguro}
brevo.sender.email=${BREVO_SENDER_EMAIL:}

# App
app.reset-password-url=${APP_RESET_PASSWORD_URL:https://hogar-seguro.app/reset-password}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
