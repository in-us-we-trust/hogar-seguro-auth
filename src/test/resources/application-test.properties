spring.datasource.url=jdbc:postgresql://localhost:5430/test_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

brevo.api.key=test-api-key
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.sender.name=Auth Service Test
brevo.sender.email=test@example.com
brevo.mailer.implementation=DUMMY

email.subject.intruder-notification=Alerta: Intruso detectado - Test