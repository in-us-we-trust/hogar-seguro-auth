name: CD (Deploy Auth Service to Cloud Run)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}

  SERVICE: auth-service

  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tp-hogar-seguro/auth-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build production Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 20 \
            --cpu-throttling \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod" \
            --set-env-vars "DB_URL=${{ secrets.DB_URL }}" \
            --set-env-vars "DB_USERNAME=${{ secrets.DB_USERNAME }}" \
            --set-env-vars "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "JWT_EXPIRATION_MS=${{ secrets.JWT_EXPIRATION_MS }}" \
            --set-env-vars "EMAIL_PROVIDER=${{ secrets.EMAIL_PROVIDER }}" \
            --set-env-vars "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" \
            --set-env-vars "BREVO_API_URL=${{ secrets.BREVO_API_URL }}" \
            --set-env-vars "BREVO_SENDER_NAME=${{ secrets.BREVO_SENDER_NAME }}" \
            --set-env-vars "BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}" \
            --set-env-vars "APP_RESET_PASSWORD_URL=${{ secrets.APP_RESET_PASSWORD_URL }}"